# Server Configuration
server.port=${PORT:8080}

# MongoDB Atlas / Local Connection
# Provide MONGODB_URI in environment variables for Atlas connection:
# e.g., mongodb+srv://<username>:<password>@cluster0.xxxxx.mongodb.net/hostel_food_attendance_db?retryWrites=true&w=majority
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hostel_food_attendance_db}
spring.data.mongodb.auto-index-creation=true

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Logging
logging.level.com.hostel.foodmgmt=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=INFO
